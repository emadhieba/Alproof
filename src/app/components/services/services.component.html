<section id="services" class="section services-section">
  <div class="container">
    <div class="text-center mb-5" data-aos="fade-up">
      <span class="section-label">{{ 'SERVICES.SUBTITLE' | translate }}</span>
      <h2 class="section-title">{{ 'SERVICES.TITLE' | translate }}</h2>
    </div>

    <div class="row g-4">
      @for (service of services; track service.id; let i = $index) {
        <div class="col-md-6 col-lg-4" data-aos="fade-up" [attr.data-aos-delay]="i * 80">
          <div class="service-card glass-card">
            <div class="service-icon">
              <i class="fas" [class]="service.icon"></i>
            </div>
            <h3>{{ service.titleKey | translate }}</h3>
            <p>{{ service.descriptionKey | translate }}</p>
            <div class="service-footer">
              <span class="service-price">{{ service.price }} {{ service.currency }}</span>
              <a
                class="btn btn-gold btn-sm"
                [href]="getBookUrl(service)"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ 'SERVICES.BOOK_NOW' | translate }}
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
