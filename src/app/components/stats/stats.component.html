<section id="stats" class="stats-section">
  <div class="stats-overlay"></div>
  <div class="container position-relative">
    <div class="row g-4">
      @for (stat of stats; track stat.labelKey; let i = $index) {
        <div class="col-6 col-lg-3" data-aos="fade-up" [attr.data-aos-delay]="i * 100">
          <div class="stat-item text-center">
            <div class="stat-icon">
              <i [class]="stat.icon"></i>
            </div>
            <div class="stat-number">
              {{ formatNumber(counters()[i], stat.suffix) }}<span class="stat-suffix">{{ stat.suffix }}</span>
            </div>
            <div class="stat-label">{{ stat.labelKey | translate }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
